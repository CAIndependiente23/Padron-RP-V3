<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="./resources/ol.css">
    <link rel="stylesheet" href="resources/fontawesome-all.min.css">
    <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
    <link rel="stylesheet" href="./resources/qgis2web.css">

    <style>
        html, body { background-color:#ffffff; }
        .ol-control > * {
            background-color:#f8f8f8 !important;
            color:#444444 !important;
            border-radius:0px;
        }
        .ol-attribution a,
        .gcd-gl-input::placeholder,
        .search-layer-input-search::placeholder { color:#444444 !important; }
        .search-layer-input-search { background-color:#f8f8f8 !important; }
        .ol-control > *:focus,
        .ol-control > *:hover { background-color:rgba(248,248,248,.7) !important; }
        .ol-control { background-color:rgba(255,255,255,.4) !important; padding:2px !important; }
        html, body, #map { width:100%; height:100%; padding:0; margin:0; }

        /* =====================================================
           BUSCADOR DE N° DE REJA
           ===================================================== */
        #buscador-reja {
            position:absolute;
            top:55px;
            left:10px;
            z-index:1000;
            width:270px;
            background:rgba(255,255,255,.95);
            padding:8px;
            border-radius:4px;
            box-shadow:0 1px 4px rgba(0,0,0,.25);
            box-sizing:border-box;
        }
        #buscador-reja-titulo {
            font-weight:bold;
            font-size:14px;
            margin-bottom:6px;
            color:#333;
        }
        #buscador-reja-fila { display:flex; gap:5px; }
        #buscador-reja-input {
            flex:1;
            min-width:0;
            height:32px;
            box-sizing:border-box;
            border:1px solid #aaa;
            border-radius:3px;
            padding:5px 8px;
            font-size:14px;
            background:#fff;
            color:#333;
        }
        #buscador-reja-boton {
            width:38px;
            height:32px;
            border:1px solid #aaa;
            border-radius:3px;
            background:#f8f8f8;
            cursor:pointer;
            font-size:16px;
        }
        #buscador-reja-boton:hover { background:#eaeaea; }
        #buscador-reja-mensaje {
            display:none;
            margin-top:6px;
            font-size:12px;
            color:#b00020;
        }

        /* =====================================================
           POPUP
           ===================================================== */
        #popup { min-width:260px; max-width:360px; }
        .popup-title { font-size:18px; font-weight:bold; margin-bottom:10px; }
        .popup-loading { color:#666666; }
        .popup-error { color:#b00020; }
        .popup-data-row { margin-bottom:5px; }
        .popup-data-row strong { margin-right:4px; }
        .popup-zone { font-size:12px; color:#777777; margin-bottom:8px; }

        @media (max-width:600px) {
            #buscador-reja { width:240px; }
        }
    </style>

    <title>Padron RP</title>
</head>

<body>
    <div id="map">
        <!-- =====================================================
             BUSCADOR DE N° DE REJA
             ===================================================== -->
        <div id="buscador-reja">
            <div id="buscador-reja-titulo">🔲 Buscar N° de reja</div>
            <div id="buscador-reja-fila">
                <input id="buscador-reja-input" type="text" placeholder="Ej.: 12RP302" autocomplete="off">
                <button id="buscador-reja-boton" type="button" title="Buscar">🔍</button>
            </div>
            <div id="buscador-reja-mensaje"></div>
        </div>

        <div id="popup" class="ol-popup">
            <a href="#" id="popup-closer" class="ol-popup-closer"></a>
            <div id="popup-content"></div>
        </div>
    </div>

    <!-- =====================================================
         SCRIPTS QGIS2WEB
         ===================================================== -->
    <script src="resources/qgis2web_expressions.js"></script>
    <script src="./resources/functions.js"></script>
    <script src="./resources/ol.js"></script>
    <script src="./resources/ol-layerswitcher.js"></script>
    <script src="resources/photon-geocoder-autocomplete.min.js"></script>
    <script src="resources/olms.js"></script>

    <!-- =====================================================
         LAYERS
         ===================================================== -->
    <script src="layers/RPZ5_1.js"></script>
    <script src="layers/RPZ4_2.js"></script>
    <script src="layers/RPZ1_3.js"></script>

    <!-- =====================================================
         ESTILOS DE LOS LAYERS
         ===================================================== -->
    <script src="styles/RPZ5_1_style.js"></script>
    <script src="styles/RPZ4_2_style.js"></script>
    <script src="styles/RPZ1_3_style.js"></script>

    <script src="./layers/layers.js" type="text/javascript"></script>
    <script src="./resources/Autolinker.min.js"></script>
    <script src="./resources/qgis2web.js"></script>

    <!-- =====================================================
         GOOGLE SHEETS + BUSCADOR + ETIQUETAS
         ===================================================== -->
    <script>
        /* =====================================================
           CONFIGURACIÓN DE PLANILLAS
           ===================================================== */
        const PLANILLAS = [
            {
                zona: "Z1",
                id: "1DFt05s339jwEDHBIZHh9UB_ULaU7RfQsgaMNnKqZKiM",
                gid: "20565275"
            },
            {
                zona: "Z4",
                id: "1M9GegflJsLEoGBMofbnh4_DiJHtmVKvFpGpc0uswX9k",
                gid: "20565275"
            },
            {
                zona: "Z5",
                id: "1occ_NIMiRZvK9oU398Fbs4INxTNs4vopFmk3G3rm4dk",
                gid: "20565275"
            }
        ];

        let datosPlanilla = {};
        let indiceRejas = {};
        let etiquetasRejas = null;
        let planillasListas = false;

        /* =====================================================
           NORMALIZAR CÓDIGOS
           ===================================================== */
        function normalizarCodigo(valor) {
            if (valor === null || valor === undefined) return "";
            return String(valor)
                .normalize("NFKC")
                .replace(/\u00A0/g, " ")
                .replace(/[\u200B-\u200D\uFEFF]/g, "")
                .trim()
                .toUpperCase();
        }

        /* =====================================================
           ESCAPAR HTML
           ===================================================== */
        function escapeHtml(valor) {
            if (valor === null || valor === undefined) return "";
            return String(valor)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        /* =====================================================
           PARSER CSV
           ===================================================== */
        function parseCSV(texto) {
            const filas = [];
            let fila = [];
            let campo = "";
            let dentroComillas = false;

            for (let i = 0; i < texto.length; i++) {
                const caracter = texto[i];
                const siguiente = texto[i + 1];

                if (caracter === '"') {
                    if (dentroComillas && siguiente === '"') {
                        campo += '"';
                        i++;
                    } else {
                        dentroComillas = !dentroComillas;
                    }
                } else if (caracter === "," && !dentroComillas) {
                    fila.push(campo);
                    campo = "";
                } else if ((caracter === "\n" || caracter === "\r") && !dentroComillas) {
                    if (caracter === "\r" && siguiente === "\n") i++;
                    fila.push(campo);
                    campo = "";
                    if (fila.some(valor => valor.trim() !== "")) filas.push(fila);
                    fila = [];
                } else {
                    campo += caracter;
                }
            }

            if (campo !== "" || fila.length > 0) {
                fila.push(campo);
                if (fila.some(valor => valor.trim() !== "")) filas.push(fila);
            }
            return filas;
        }

        /* =====================================================
           CARGAR UNA PLANILLA
           ===================================================== */
        async function cargarPlanilla(planilla) {
            const url =
                "https://docs.google.com/spreadsheets/d/" +
                planilla.id +
                "/gviz/tq?tqx=out:csv&gid=" +
                planilla.gid;

            try {
                const respuesta = await fetch(url);
                if (!respuesta.ok) {
                    throw new Error("HTTP " + respuesta.status + " - " + respuesta.statusText);
                }

                const csv = await respuesta.text();
                const filas = parseCSV(csv);
                if (!filas.length) throw new Error("El CSV está vacío.");

                /* Buscar automáticamente la fila de encabezados. */
                let filaEncabezados = -1;

                for (let i = 0; i < filas.length; i++) {
                    if (!filas[i] || !filas[i].length) continue;

                    const primeraCelda = normalizarCodigo(filas[i][0]);
                    if (
                        primeraCelda === "N° REJA" ||
                        primeraCelda === "Nº REJA" ||
                        primeraCelda === "N°REJA" ||
                        primeraCelda === "NºREJA"
                    ) {
                        filaEncabezados = i;
                        break;
                    }
                }

                if (filaEncabezados === -1) {
                    throw new Error("No se encontró la fila de encabezados.");
                }

                const encabezados = filas[filaEncabezados];
                const registros = [];

                for (let i = filaEncabezados + 1; i < filas.length; i++) {
                    const fila = filas[i];
                    if (!fila || !fila.length) continue;

                    const codigo = normalizarCodigo(fila[0]);
                    if (!codigo) continue;

                    const registro = {};

                    /* A:W = 23 columnas. */
                    for (let j = 0; j < 23; j++) {
                        const nombreCampo = encabezados[j] || "columna_" + (j + 1);
                        registro[nombreCampo] = fila[j] !== undefined ? fila[j] : "";
                    }

                    registro.__codigo = codigo;
                    registro.__zona = planilla.zona;

                    /* Campos que se muestran en el popup. */
                    registro.__etiqueta = {
                        nroReja: fila[0] !== undefined ? fila[0] : "",
                        comuna: fila[2] !== undefined ? fila[2] : "",
                        alturaInicio: fila[4] !== undefined ? fila[4] : "",
                        alturaFin: fila[5] !== undefined ? fila[5] : "",
                        calle: fila[6] !== undefined ? fila[6] : "",
                        longitud: fila[13] !== undefined ? fila[13] : ""
                    };

                    registros.push(registro);
                }

                datosPlanilla[planilla.zona] = registros;

                registros.forEach(registro => {
                    const codigo = registro.__codigo;
                    if (!codigo) return;
                    if (!indiceRejas[codigo]) indiceRejas[codigo] = registro;
                });

                console.log(planilla.zona + " - registros cargados:", registros.length);
                return true;
            } catch (error) {
                console.error("Error cargando " + planilla.zona + ":", error);
                return false;
            }
        }

        /* =====================================================
           CARGAR TODAS LAS PLANILLAS
           ===================================================== */
        async function cargarTodasLasPlanillas() {
            console.log("Cargando información desde Google Sheets...");

            const resultados = await Promise.all(
                PLANILLAS.map(planilla => cargarPlanilla(planilla))
            );

            const cantidadCorrectas = resultados.filter(resultado => resultado).length;
            planillasListas = cantidadCorrectas > 0;

            console.log("Planillas cargadas:", cantidadCorrectas, "/", PLANILLAS.length);
            console.log("Total de códigos indexados:", Object.keys(indiceRejas).length);
            console.log("Google Sheets listo.");
        }

        /* =====================================================
           BUSCAR REJA EN GOOGLE SHEETS
           ===================================================== */
        function buscarReja(codigo) {
            const codigoNormalizado = normalizarCodigo(codigo);
            return indiceRejas[codigoNormalizado] || null;
        }

        /* =====================================================
           MOSTRAR INFORMACIÓN
           ===================================================== */
        function mostrarInformacionReja(codigo, datos) {
            const contenido = document.getElementById("popup-content");
            if (!contenido) return;

            if (!datos) {
                contenido.innerHTML =
                    '<div class="popup-title">🔲 ' + escapeHtml(codigo) + '</div>' +
                    '<div class="popup-error">No se encontró información para esta reja en las planillas.</div>';
                return;
            }

            const campos = datos.__etiqueta || {};

            let html =
                '<div class="popup-title">🔲 ' + escapeHtml(codigo) + '</div>' +
                '<div class="popup-zone">Planilla: ' + escapeHtml(datos.__zona) + '</div>';

            const mostrarCampo = (etiqueta, valor) => {
                if (valor === null || valor === undefined || String(valor).trim() === "") return;
                html +=
                    '<div class="popup-data-row">' +
                    '<strong>' + escapeHtml(etiqueta) + ':</strong> ' +
                    escapeHtml(valor) +
                    '</div>';
            };

            mostrarCampo("N° Reja", campos.nroReja);
            mostrarCampo("Comuna", campos.comuna);
            mostrarCampo("Calle", campos.calle);
            mostrarCampo("Altura inicio", campos.alturaInicio);
            mostrarCampo("Altura fin", campos.alturaFin);
            mostrarCampo("Longitud", campos.longitud);

            contenido.innerHTML = html;
        }

        /* =====================================================
           BUSCAR FEATURE DEL MAPA POR CAMPO "text"
           ===================================================== */
        function buscarFeatureEnMapa(codigo) {
            if (typeof map === "undefined" || !map) return null;

            const codigoNormalizado = normalizarCodigo(codigo);
            let encontrado = null;

            function recorrerCapa(capa, capaPadreVisible) {
                if (!capa || encontrado) return;

                /* No buscar dentro de nuestra capa auxiliar de etiquetas. */
                if (capa.get && capa.get("esCapaEtiquetas")) return;

                const visible = capaPadreVisible &&
                    (!capa.getVisible || capa.getVisible());

                const subcapas = capa.getLayers ? capa.getLayers() : null;

                if (subcapas) {
                    subcapas.forEach(subcapa => recorrerCapa(subcapa, visible));
                    return;
                }

                const source = capa.getSource ? capa.getSource() : null;
                if (!source || !source.getFeatures) return;

                const features = source.getFeatures();
                for (let i = 0; i < features.length; i++) {
                    const feature = features[i];
                    const texto = feature.get("text");

                    if (texto !== undefined && texto !== null &&
                        normalizarCodigo(texto) === codigoNormalizado) {
                        encontrado = { feature: feature, layer: capa };
                        return;
                    }
                }
            }

            map.getLayers().forEach(capa => recorrerCapa(capa, true));
            return encontrado;
        }

        /* =====================================================
           POSICIONAR Y ABRIR UNA REJA
           ===================================================== */
        function abrirRejaEncontrada(codigo, resultadoMapa) {
            if (!resultadoMapa || !resultadoMapa.feature) return false;

            const feature = resultadoMapa.feature;
            const layer = resultadoMapa.layer;
            const geometria = feature.getGeometry();

            if (!geometria) return false;

            if (layer && layer.setVisible) layer.setVisible(true);

            let coordenada;
            const tipo = geometria.getType();

            if (tipo === "Point" || tipo === "MultiPoint") {
                coordenada = tipo === "Point"
                    ? geometria.getCoordinates()
                    : geometria.getClosestPoint(geometria.getCoordinates()[0]);
            } else if (geometria.getInteriorPoint) {
                coordenada = geometria.getInteriorPoint().getCoordinates();
            } else {
                coordenada = geometria.getClosestPoint(map.getView().getCenter());
            }

            const datos = buscarReja(codigo);
            mostrarInformacionReja(codigo, datos);

            map.getView().animate({
                center: coordenada,
                zoom: 19,
                duration: 650
            });

            setTimeout(function() {
                if (typeof popup !== "undefined" && popup) {
                    popup.setPosition(coordenada);
                } else if (typeof overlay !== "undefined" && overlay) {
                    overlay.setPosition(coordenada);
                }
            }, 700);

            return true;
        }

        /* =====================================================
           BUSCADOR DE N° DE REJA
           ===================================================== */
        function ejecutarBusquedaReja() {
            const input = document.getElementById("buscador-reja-input");
            const mensaje = document.getElementById("buscador-reja-mensaje");
            if (!input || !mensaje) return;

            const codigo = normalizarCodigo(input.value);
            mensaje.style.display = "none";
            mensaje.textContent = "";

            if (!codigo) {
                mensaje.textContent = "Ingresá un N° de reja.";
                mensaje.style.display = "block";
                return;
            }

            if (!planillasListas) {
                mensaje.textContent = "La información todavía se está cargando. Probá nuevamente en unos segundos.";
                mensaje.style.display = "block";
                return;
            }

            const datos = buscarReja(codigo);
            if (!datos) {
                mensaje.textContent = "No se encontró el N° de reja en las planillas.";
                mensaje.style.display = "block";
                return;
            }

            const resultadoMapa = buscarFeatureEnMapa(codigo);
            if (!resultadoMapa) {
                mensaje.textContent = "La reja existe en la planilla, pero no se encontró en el mapa.";
                mensaje.style.display = "block";
                return;
            }

            abrirRejaEncontrada(codigo, resultadoMapa);
        }

        function activarBuscadorReja() {
            const boton = document.getElementById("buscador-reja-boton");
            const input = document.getElementById("buscador-reja-input");

            if (!boton || !input) return;

            boton.addEventListener("click", ejecutarBusquedaReja);
            input.addEventListener("keydown", function(evt) {
                if (evt.key === "Enter") ejecutarBusquedaReja();
            });
        }

        /* =====================================================
           ETIQUETAS DE REJAS

           Se muestran a escala aproximada 1:1000 o más cerca.
           En EPSG:3857, a 96 DPI, 1:1000 equivale a aprox.
           0.2646 metros por píxel.
           ===================================================== */
        const RESOLUCION_ETIQUETAS = 0.2646;

        function obtenerFeaturesDeCapasRejas() {
            const resultado = [];
            const yaAgregadas = new Set();

            function recorrer(capa) {
                if (!capa) return;
                if (capa.get && capa.get("esCapaEtiquetas")) return;

                const subcapas = capa.getLayers ? capa.getLayers() : null;
                if (subcapas) {
                    subcapas.forEach(recorrer);
                    return;
                }

                const source = capa.getSource ? capa.getSource() : null;
                if (!source || !source.getFeatures) return;

                source.getFeatures().forEach(feature => {
                    const codigo = feature.get("text");
                    if (codigo === undefined || codigo === null || String(codigo).trim() === "") return;
                    if (yaAgregadas.has(feature)) return;

                    yaAgregadas.add(feature);
                    resultado.push({
                        feature: feature,
                        layer: capa
                    });
                });
            }

            map.getLayers().forEach(recorrer);
            return resultado;
        }

        function crearEtiquetasRejas() {
            if (typeof map === "undefined" || !map) return;
            if (etiquetasRejas) return;

            const elementos = obtenerFeaturesDeCapasRejas();
            const featuresEtiquetas = [];

            elementos.forEach(item => {
                const geometria = item.feature.getGeometry();
                if (!geometria) return;

                let coordenada = null;
                if (geometria.getType() === "Point") {
                    coordenada = geometria.getCoordinates();
                } else if (geometria.getInteriorPoint) {
                    coordenada = geometria.getInteriorPoint().getCoordinates();
                }

                if (!coordenada) return;

                const etiqueta = new ol.Feature({
                    geometry: new ol.geom.Point(coordenada),
                    textoEtiqueta: String(item.feature.get("text")),
                    featureOrigen: item.feature,
                    layerOrigen: item.layer
                });

                featuresEtiquetas.push(etiqueta);
            });

            const sourceEtiquetas = new ol.source.Vector({
                features: featuresEtiquetas
            });

            etiquetasRejas = new ol.layer.Vector({
                source: sourceEtiquetas,
                zIndex: 1000,
                declutter: true,
                updateWhileAnimating: true,
                updateWhileInteracting: true,
                properties: {
                    esCapaEtiquetas: true,
                    title: "Etiquetas de rejas"
                },
                style: function(feature, resolution) {
                    if (resolution > RESOLUCION_ETIQUETAS) return null;

                    const origen = feature.get("layerOrigen");
                    if (origen && origen.getVisible && !origen.getVisible()) return null;

                    const texto = feature.get("textoEtiqueta");
                    if (!texto) return null;

                    return new ol.style.Style({
                        text: new ol.style.Text({
                            text: String(texto),
                            font: "bold 11px Arial,sans-serif",
                            offsetY: -12,
                            padding: [2, 3, 2, 3],
                            fill: new ol.style.Fill({ color: "#222222" }),
                            stroke: new ol.style.Stroke({ color: "#ffffff", width: 3 })
                        })
                    });
                }
            });

            map.addLayer(etiquetasRejas);
            console.log("Etiquetas de rejas creadas:", featuresEtiquetas.length);
        }

        /* =====================================================
           ACTIVAR CLICK EN EL MAPA
           ===================================================== */
        function activarConsultaPlanilla() {
            if (typeof map === "undefined" || !map) return;

            map.on("singleclick", function(evt) {
                let featureEncontrada = null;

                map.forEachFeatureAtPixel(
                    evt.pixel,
                    function(feature) {
                        if (!feature) return;
                        if (feature.get("esCapaEtiquetas")) return;

                        const codigoText = feature.get("text");
                        if (
                            codigoText !== undefined &&
                            codigoText !== null &&
                            String(codigoText).trim() !== ""
                        ) {
                            featureEncontrada = feature;
                            return feature;
                        }
                        return null;
                    },
                    { hitTolerance: 5 }
                );

                if (!featureEncontrada) return;

                const codigo = featureEncontrada.get("text");
                const datos = buscarReja(codigo);

                mostrarInformacionReja(codigo, datos);

                if (typeof popup !== "undefined" && popup) {
                    popup.setPosition(evt.coordinate);
                } else if (typeof overlay !== "undefined" && overlay) {
                    overlay.setPosition(evt.coordinate);
                }
            });
        }

        /* =====================================================
           INICIAR
           ===================================================== */
        activarBuscadorReja();
        cargarTodasLasPlanillas();

        /* Esperar a que QGIS2WEB cree el mapa. */
        let intentosMapa = 0;
        const intervaloMapa = setInterval(function() {
            intentosMapa++;

            if (typeof map !== "undefined" && map) {
                clearInterval(intervaloMapa);
                activarConsultaPlanilla();
                crearEtiquetasRejas();
                return;
            }

            if (intentosMapa >= 100) {
                clearInterval(intervaloMapa);
                console.error("No se pudo encontrar el mapa.");
            }
        }, 100);
    </script>
</body>
</html>
