<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">

        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">

        <style>
        html, body {
            background-color: #ffffff;
        }

        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }

        .ol-attribution a,
        .gcd-gl-input::placeholder,
        .search-layer-input-search::placeholder {
            color: #444444!important;
        }

        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }

        .ol-control > *:focus,
        .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        }

        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        }
        </style>

        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }

        /* Información de Google Sheets */

        #popup-content table.sheet-info {
            border-collapse: collapse;
            width: 100%;
            font-size: 13px;
        }

        #popup-content table.sheet-info td {
            padding: 4px 6px;
            border-bottom: 1px solid #ddd;
            vertical-align: top;
        }

        #popup-content table.sheet-info td:first-child {
            font-weight: bold;
            white-space: nowrap;
            color: #555;
        }

        #popup-content .sheet-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        #popup-content .sheet-loading {
            padding: 10px;
            color: #666;
        }

        #popup-content .sheet-error {
            padding: 10px;
            color: #a00;
        }

        #popup-content .sheet-success {
            padding: 10px;
            color: #176b2c;
        }

        #popup-content .sheet-debug {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid #ddd;
            font-size: 11px;
            color: #777;
        }
        </style>

        <title></title>
    </head>

    <body>

        <div id="map">

            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>

        </div>


        <!-- ========================================================= -->
        <!-- LIBRERÍAS -->
        <!-- ========================================================= -->

        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>


        <!-- ========================================================= -->
        <!-- PAPAPARSE -->
        <!-- ========================================================= -->

        <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.3/papaparse.min.js"></script>


        <!-- ========================================================= -->
        <!-- CAPA Y ESTILOS GENERADOS POR QGIS2WEB -->
        <!-- ========================================================= -->

        <script src="layers/RPZ1_1.js"></script>
        <script src="styles/RPZ1_1_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script>

        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>


        <!-- ========================================================= -->
        <!-- GOOGLE SHEETS -->
        <!-- ========================================================= -->

        <script>

        /*
         * ============================================================
         * CONFIGURACIÓN
         * ============================================================
         */

        const SHEET_URL =
            'https://docs.google.com/spreadsheets/d/1DFt05s339jwEDHBIZHh9UB_ULaU7RfQsgaMNnKqZKiM/gviz/tq?tqx=out:csv&gid=20565275';


        /*
         * La planilla se lee de A:W.
         *
         * Estructura real:
         *
         * FILA 1 → se ignora
         * FILA 2 → encabezados
         * FILA 3 → primer registro
         * FILA 4 → segundo registro
         * etc.
         *
         * Relación:
         *
         * QGIS "text"
         *       ↓
         * Google Sheets columna A
         *
         * El campo "fid" NO se utiliza.
         */


        let datosPlanilla = [];

        let indiceRejas = {};


        /*
         * ============================================================
         * NORMALIZAR CÓDIGO
         * ============================================================
         */

        function normalizarCodigo(valor) {

            if (valor === null || valor === undefined) {
                return '';
            }

            return String(valor)
                .normalize('NFKC')
                .trim()
                .toUpperCase();
        }


        /*
         * ============================================================
         * ESCAPE HTML
         * ============================================================
         */

        function escapeHtml(valor) {

            if (valor === null || valor === undefined) {
                return '';
            }

            return String(valor)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }


        /*
         * ============================================================
         * CARGAR GOOGLE SHEETS
         * ============================================================
         */

        function cargarPlanilla() {

            console.log(
                'Cargando información desde Google Sheets...'
            );


            /*
             * Comprobar que PapaParse esté disponible
             */

            if (typeof Papa === 'undefined') {

                console.error(
                    'PapaParse no está cargado.'
                );

                return;
            }


            fetch(SHEET_URL)

                .then(function(response) {

                    if (!response.ok) {

                        throw new Error(
                            'No se pudo acceder a Google Sheets. Código HTTP: ' +
                            response.status
                        );
                    }

                    return response.text();
                })


                .then(function(csv) {

                    console.log(
                        'CSV de Google Sheets recibido.'
                    );


                    Papa.parse(csv, {

                        header: false,

                        skipEmptyLines: true,


                        complete: function(resultado) {

                            const filas = resultado.data;


                            /*
                             * Necesitamos como mínimo:
                             *
                             * fila 1 → algo
                             * fila 2 → encabezados
                             * fila 3 → datos
                             */

                            if (!filas || filas.length < 3) {

                                console.error(
                                    'La planilla no contiene datos suficientes.'
                                );

                                return;
                            }


                            /*
                             * =================================================
                             * FILA 2 = ENCABEZADOS
                             * =================================================
                             *
                             * En JavaScript:
                             *
                             * fila 1 → índice 0
                             * fila 2 → índice 1
                             */

                            const encabezados = filas[1];


                            console.log(
                                'Encabezados detectados:',
                                encabezados
                            );


                            /*
                             * =================================================
                             * FILA 3 EN ADELANTE = DATOS
                             * =================================================
                             *
                             * Por eso usamos slice(2).
                             */

                            datosPlanilla =
                                filas.slice(2).map(function(fila) {

                                    let objeto = {};


                                    /*
                                     * A:W
                                     *
                                     * A = 0
                                     * B = 1
                                     * ...
                                     * W = 22
                                     */

                                    for (let i = 0; i <= 22; i++) {

                                        let nombreCampo =
                                            encabezados[i] ||
                                            'Columna ' + (i + 1);


                                        objeto[nombreCampo] =
                                            fila[i] !== undefined
                                                ? fila[i]
                                                : '';
                                    }


                                    /*
                                     * =================================================
                                     * COLUMNA A
                                     * =================================================
                                     *
                                     * Guardamos explícitamente el código.
                                     *
                                     * Este es el valor que después se comparará
                                     * contra feature.get('text').
                                     */

                                    objeto.__codigo =
                                        fila[0] !== undefined
                                            ? fila[0]
                                            : '';


                                    return objeto;

                                });


                            /*
                             * =================================================
                             * CREAR ÍNDICE DE REJAS
                             * =================================================
                             *
                             * Ejemplo:
                             *
                             * indiceRejas["12RP362"]
                             *
                             * devuelve la fila correspondiente de Sheets.
                             */

                            indiceRejas = {};


                            datosPlanilla.forEach(function(fila) {

                                const codigo =
                                    normalizarCodigo(
                                        fila.__codigo
                                    );


                                if (codigo !== '') {

                                    indiceRejas[codigo] = fila;
                                }

                            });


                            /*
                             * =================================================
                             * INFORMACIÓN DE DEPURACIÓN
                             * =================================================
                             */

                            console.log(
                                'Google Sheets cargado correctamente.'
                            );


                            console.log(
                                'Cantidad de filas:',
                                datosPlanilla.length
                            );


                            console.log(
                                'Cantidad de códigos indexados:',
                                Object.keys(indiceRejas).length
                            );


                            /*
                             * Prueba específica.
                             */

                            console.log(
                                'Prueba 12RP302:',
                                indiceRejas[
                                    normalizarCodigo('12RP302')
                                ]
                            );


                            console.log(
                                'Prueba 12RP362:',
                                indiceRejas[
                                    normalizarCodigo('12RP362')
                                ]
                            );

                        }

                    });

                })


                .catch(function(error) {

                    console.error(
                        'Error cargando Google Sheets:',
                        error
                    );

                });

        }


        /*
         * ============================================================
         * BUSCAR REJA
         * ============================================================
         */

        function buscarReja(codigo) {

            const codigoNormalizado =
                normalizarCodigo(codigo);


            return indiceRejas[codigoNormalizado] || null;
        }


        /*
         * ============================================================
         * MOSTRAR INFORMACIÓN
         * ============================================================
         */

        function mostrarInformacionReja(codigo, fila) {

            const popupContent =
                document.getElementById('popup-content');


            if (!popupContent) {
                return;
            }


            /*
             * --------------------------------------------------------
             * NO ENCONTRADA
             * --------------------------------------------------------
             */

            if (!fila) {

                popupContent.innerHTML =
                    '<div class="sheet-error">' +

                    '<strong>' +
                    escapeHtml(codigo) +
                    '</strong>' +

                    '<br><br>' +

                    'No se encontró información para esta reja ' +
                    'en la planilla.' +

                    '<div class="sheet-debug">' +
                    'Búsqueda realizada en columna A.<br>' +
                    'Campo utilizado del mapa: <strong>text</strong>.<br>' +
                    'Código buscado: <strong>' +
                    escapeHtml(codigo) +
                    '</strong>' +
                    '</div>' +

                    '</div>';

                return;
            }


            /*
             * --------------------------------------------------------
             * ENCONTRADA
             * --------------------------------------------------------
             *
             * Todavía no mostramos A:W.
             *
             * Primero confirmamos que la relación funciona.
             */

            popupContent.innerHTML =

                '<div class="sheet-success">' +

                    '<div class="sheet-title">' +
                        '🔲 ' +
                        escapeHtml(codigo) +
                    '</div>' +

                    '<strong>✓ Información encontrada</strong>' +

                    '<div class="sheet-debug">' +
                        'Coincidencia: campo <strong>text</strong> ' +
                        'del mapa → columna <strong>A</strong> de la planilla.' +
                    '</div>' +

                '</div>';

        }


        /*
         * ============================================================
         * ACTIVAR CONSULTA DE PLANILLA
         * ============================================================
         */

        function activarConsultaPlanilla() {

            if (typeof map === 'undefined') {

                console.error(
                    'No se encontró el objeto "map" de OpenLayers.'
                );

                return;
            }


            console.log(
                'Mapa encontrado. Activando consulta de Google Sheets.'
            );


            map.on('singleclick', function(evt) {

                let featureEncontrada = null;


                /*
                 * Buscar una geometría debajo del cursor.
                 */

                map.forEachFeatureAtPixel(

                    evt.pixel,

                    function(feature, layer) {


                        /*
                         * =================================================
                         * SOLO NOS INTERESA LA CAPA DE REJAS
                         * =================================================
                         */

                        if (
                            layer &&
                            layer.get('title') &&
                            layer.get('title')
                                .toString()
                                .includes('RP')
                        ) {

                            featureEncontrada = feature;

                            return true;
                        }


                        /*
                         * Si no podemos identificar la capa por título,
                         * tomamos la primera geometría.
                         */

                        if (!featureEncontrada) {

                            featureEncontrada = feature;
                        }

                    }

                );


                if (!featureEncontrada) {
                    return;
                }


                /*
                 * =========================================================
                 * CAMPO UTILIZADO: "text"
                 * =========================================================
                 *
                 * IMPORTANTE:
                 *
                 * fid → ignorado
                 * text → utilizado
                 */

                const codigo =
                    featureEncontrada.get('text');


                console.log(
                    'Campo text del elemento:',
                    codigo
                );


                console.log(
                    'Campo fid del elemento (NO UTILIZADO):',
                    featureEncontrada.get('fid')
                );


                /*
                 * Si no existe text
                 */

                if (
                    codigo === undefined ||
                    codigo === null ||
                    String(codigo).trim() === ''
                ) {

                    console.warn(
                        'La geometría seleccionada no tiene campo "text".'
                    );

                    return;
                }


                const codigoTexto =
                    String(codigo).trim();


                /*
                 * =========================================================
                 * BUSCAR EN COLUMNA A
                 * ========================================================= */

                const fila =
                    buscarReja(codigoTexto);


                console.log(
                    'Código QGIS (text):',
                    codigoTexto
                );


                console.log(
                    '¿Encontrado en columna A?:',
                    fila !== null
                );


                /*
                 * Esperamos un instante para que qgis2web termine
                 * de mostrar su popup original.
                 */

                setTimeout(function() {

                    mostrarInformacionReja(
                        codigoTexto,
                        fila
                    );

                }, 50);

            });


            console.log(
                'Consulta de Google Sheets activada correctamente.'
            );

        }


        /*
         * ============================================================
         * INICIO
         * ============================================================
         */


        /*
         * Cargar planilla.
         */

        cargarPlanilla();


        /*
         * Esperar a que qgis2web haya creado el mapa.
         */

        setTimeout(function() {

            activarConsultaPlanilla();

        }, 500);

        </script>

    </body>
</html>
