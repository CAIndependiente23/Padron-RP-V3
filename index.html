    <!-- =====================================================
         GOOGLE SHEETS
         ===================================================== -->

    <script>

        /*
         * =====================================================
         * CONFIGURACIÓN DE PLANILLAS
         * =====================================================
         *
         * ESTA ES LA ÚNICA PARTE QUE DEBERÍAS NECESITAR
         * MODIFICAR CUANDO AGREGUES UNA NUEVA ZONA.
         *
         * Cada objeto representa una Google Sheet.
         *
         * id   = ID de la planilla
         * gid  = ID de la pestaña
         * zona = nombre que queremos identificar
         *
         */


        const PLANILLAS = [

            {
                zona: "Z1",

                id: "1DFt05s339jwEDHBIZHh9UB_ULaU7RfQsgaMNnKqZKiM",

                gid: "20565275"
            },


            {
                zona: "Z4",

                id: "1M9GegflJsLEoGBMofbnh4_DiJHtmVKvFpGpc0uswX9k",

                gid: "20565275"
            },


            {
                zona: "Z5",

                id: "1occ_NIMiRZvK9oU398Fbs4INxTNs4vopFmk3G3rm4dk",

                gid: "20565275"
            }

        ];



        /*
         * =====================================================
         * VARIABLES INTERNAS
         * =====================================================
         */


        let datosPlanilla = {};

        let indiceRejas = {};



        /*
         * =====================================================
         * NORMALIZAR CÓDIGOS
         * =====================================================
         */


        function normalizarCodigo(valor) {

            if (
                valor === null ||
                valor === undefined
            ) {

                return "";

            }


            return String(valor)

                .normalize("NFKC")

                .replace(/\u00A0/g, " ")

                .replace(/[\u200B-\u200D\uFEFF]/g, "")

                .trim()

                .toUpperCase();

        }



        /*
         * =====================================================
         * ESCAPAR HTML
         * =====================================================
         */


        function escapeHtml(valor) {

            if (
                valor === null ||
                valor === undefined
            ) {

                return "";

            }


            return String(valor)

                .replace(/&/g, "&amp;")

                .replace(/</g, "&lt;")

                .replace(/>/g, "&gt;")

                .replace(/"/g, "&quot;")

                .replace(/'/g, "&#039;");

        }



        /*
         * =====================================================
         * PARSER CSV
         * =====================================================
         */


        function parseCSV(texto) {

            const filas = [];

            let fila = [];

            let campo = "";

            let dentroComillas = false;


            for (
                let i = 0;
                i < texto.length;
                i++
            ) {

                const caracter = texto[i];

                const siguiente = texto[i + 1];


                if (caracter === '"') {

                    if (
                        dentroComillas &&
                        siguiente === '"'
                    ) {

                        campo += '"';

                        i++;

                    } else {

                        dentroComillas =
                            !dentroComillas;

                    }


                } else if (
                    caracter === "," &&
                    !dentroComillas
                ) {

                    fila.push(campo);

                    campo = "";


                } else if (
                    (
                        caracter === "\n" ||
                        caracter === "\r"
                    ) &&
                    !dentroComillas
                ) {

                    if (
                        caracter === "\r" &&
                        siguiente === "\n"
                    ) {

                        i++;

                    }


                    fila.push(campo);

                    campo = "";


                    if (
                        fila.some(
                            valor =>
                            valor.trim() !== ""
                        )
                    ) {

                        filas.push(fila);

                    }


                    fila = [];


                } else {

                    campo += caracter;

                }

            }


            if (
                campo !== "" ||
                fila.length > 0
            ) {

                fila.push(campo);


                if (
                    fila.some(
                        valor =>
                        valor.trim() !== ""
                    )
                ) {

                    filas.push(fila);

                }

            }


            return filas;

        }



        /*
         * =====================================================
         * CARGAR UNA PLANILLA
         * =====================================================
         */


        async function cargarPlanilla(planilla) {


            console.log(
                "--------------------------------------"
            );


            console.log(
                "Cargando planilla:",
                planilla.zona
            );


            const url =

                "https://docs.google.com/spreadsheets/d/" +

                planilla.id +

                "/gviz/tq?tqx=out:csv&gid=" +

                planilla.gid;


            try {


                const respuesta =
                    await fetch(url);


                if (!respuesta.ok) {

                    throw new Error(

                        "HTTP " +

                        respuesta.status +

                        " - " +

                        respuesta.statusText

                    );

                }


                const csv =
                    await respuesta.text();


                console.log(

                    planilla.zona +

                    " - CSV recibido:",

                    csv.length,

                    "caracteres"

                );


                const filas =
                    parseCSV(csv);


                console.log(

                    planilla.zona +

                    " - filas detectadas:",

                    filas.length

                );


                if (!filas.length) {

                    throw new Error(
                        "El CSV está vacío."
                    );

                }



                /*
                 * =================================================
                 * BUSCAR AUTOMÁTICAMENTE LA FILA DE ENCABEZADOS
                 * =================================================
                 */


                let filaEncabezados = -1;


                for (
                    let i = 0;
                    i < filas.length;
                    i++
                ) {


                    if (
                        !filas[i] ||
                        !filas[i].length
                    ) {

                        continue;

                    }


                    const primeraCelda =

                        normalizarCodigo(
                            filas[i][0]
                        );


                    if (

                        primeraCelda === "N° REJA" ||

                        primeraCelda === "Nº REJA" ||

                        primeraCelda === "N°REJA" ||

                        primeraCelda === "NºREJA"

                    ) {

                        filaEncabezados = i;

                        break;

                    }

                }



                if (
                    filaEncabezados === -1
                ) {

                    console.error(

                        planilla.zona +

                        " - No se encontró N° Reja."

                    );


                    console.log(

                        "Primeras filas:",

                        filas.slice(0, 5)

                    );


                    throw new Error(

                        "No se encontró la fila de encabezados."

                    );

                }



                console.log(

                    planilla.zona +

                    " - encabezados en fila:",

                    filaEncabezados + 1

                );


                const encabezados =
                    filas[filaEncabezados];


                console.log(

                    planilla.zona +

                    " - encabezados:",

                    encabezados

                );



                /*
                 * =================================================
                 * LEER DATOS A:W
                 * =================================================
                 */


                const registros = [];


                for (
                    let i = filaEncabezados + 1;
                    i < filas.length;
                    i++
                ) {


                    const fila = filas[i];


                    if (
                        !fila ||
                        !fila.length
                    ) {

                        continue;

                    }


                    const codigo =
                        normalizarCodigo(
                            fila[0]
                        );


                    if (!codigo) {

                        continue;

                    }


                    const registro = {};


                    /*
                     * A:W = 23 columnas
                     */


                    for (
                        let j = 0;
                        j < 23;
                        j++
                    ) {


                        const nombreCampo =

                            encabezados[j] ||

                            "columna_" +
                            (j + 1);


                        registro[nombreCampo] =

                            fila[j] !== undefined

                                ? fila[j]

                                : "";

                    }


                    registro.__codigo =
                        codigo;


                    registro.__zona =
                        planilla.zona;


                    registros.push(
                        registro
                    );

                }



                /*
                 * Guardar datos de esta zona
                 */


                datosPlanilla[
                    planilla.zona
                ] = registros;



                /*
                 * =================================================
                 * CREAR ÍNDICE GLOBAL
                 * =================================================
                 */


                registros.forEach(
                    registro => {


                        const codigo =
                            registro.__codigo;


                        if (!codigo) {

                            return;

                        }


                        /*
                         * Si por alguna razón hubiera
                         * códigos repetidos entre planillas,
                         * conservamos el primero.
                         */


                        if (
                            !indiceRejas[codigo]
                        ) {

                            indiceRejas[codigo] =
                                registro;

                        }

                    }
                );



                console.log(

                    planilla.zona +

                    " - registros cargados:",

                    registros.length

                );


                console.log(

                    planilla.zona +

                    " - primer código:",

                    registros.length

                        ? registros[0].__codigo

                        : "NINGUNO"

                );


                return true;


            } catch (error) {


                console.error(

                    "Error cargando " +

                    planilla.zona +

                    ":",

                    error

                );


                return false;

            }

        }



        /*
         * =====================================================
         * CARGAR TODAS LAS PLANILLAS
         * =====================================================
         */


        async function cargarTodasLasPlanillas() {


            console.log(
                "======================================"
            );


            console.log(
                "Cargando información desde Google Sheets..."
            );


            console.log(

                "Planillas configuradas:",

                PLANILLAS.length

            );


            /*
             * Cargamos todas simultáneamente.
             */


            const resultados =
                await Promise.all(

                    PLANILLAS.map(

                        planilla =>
                            cargarPlanilla(
                                planilla
                            )

                    )

                );


            const cantidadCorrectas =
                resultados.filter(
                    resultado => resultado
                ).length;


            console.log(
                "======================================"
            );


            console.log(

                "Planillas cargadas:",

                cantidadCorrectas,

                "/",

                PLANILLAS.length

            );


            console.log(

                "Total de códigos indexados:",

                Object.keys(
                    indiceRejas
                ).length

            );


            console.log(

                "Primeros 20 códigos:",

                Object.keys(
                    indiceRejas
                ).slice(0, 20)

            );


            /*
             * Pruebas conocidas
             */


            console.log(

                "Prueba 12RP302:",

                indiceRejas[
                    normalizarCodigo(
                        "12RP302"
                    )
                ]

            );


            console.log(

                "Prueba 12RP362:",

                indiceRejas[
                    normalizarCodigo(
                        "12RP362"
                    )
                ]

            );


            console.log(
                "Google Sheets listo."
            );


        }



        /*
         * =====================================================
         * BUSCAR REJA
         * =====================================================
         */


        function buscarReja(codigo) {


            const codigoNormalizado =

                normalizarCodigo(
                    codigo
                );


            console.log(

                "Buscando código:",

                codigoNormalizado

            );


            const resultado =

                indiceRejas[
                    codigoNormalizado
                ];


            if (resultado) {


                console.log(

                    "REJA ENCONTRADA:",

                    resultado

                );


                return resultado;

            }


            console.warn(

                "No se encontró:",

                codigoNormalizado

            );


            return null;

        }



        /*
         * =====================================================
         * MOSTRAR INFORMACIÓN
         * =====================================================
         *
         * POR AHORA mostramos todos los campos con contenido.
         *
         * Cuando confirmemos que Z1/Z4/Z5 funcionan,
         * reemplazamos esto por solamente los campos que
         * quieras mostrar.
         *
         */


        function mostrarInformacionReja(
            codigo,
            datos
        ) {


            const contenido =

                document.getElementById(
                    "popup-content"
                );


            if (!contenido) {

                return;

            }



            if (!datos) {


                contenido.innerHTML =

                    '<div class="popup-title">' +

                    '🔲 ' +

                    escapeHtml(codigo) +

                    '</div>' +

                    '<div class="popup-error">' +

                    'No se encontró información para esta reja en las planillas.'

                    +

                    '</div>' +

                    '<div style="margin-top:8px;font-size:12px;color:#777;">' +

                    'Búsqueda realizada en columna A.<br>' +

                    'Campo utilizado del mapa: <b>text</b>.<br>' +

                    'Código buscado: <b>' +

                    escapeHtml(codigo) +

                    '</b>' +

                    '</div>';


                return;

            }



            let html =


                '<div class="popup-title">' +

                '🔲 ' +

                escapeHtml(codigo) +

                '</div>' +


                '<div class="popup-zone">' +

                'Planilla: ' +

                escapeHtml(
                    datos.__zona
                ) +

                '</div>';



            Object.keys(datos).forEach(
                campo => {


                    /*
                     * Estos campos son internos.
                     */


                    if (
                        campo === "__codigo" ||
                        campo === "__zona"
                    ) {

                        return;

                    }


                    const valor =
                        datos[campo];


                    if (
                        valor === null ||
                        valor === undefined ||
                        String(valor).trim() === ""
                    ) {

                        return;

                    }


                    html +=

                        '<div class="popup-data-row">' +

                        '<strong>' +

                        escapeHtml(
                            campo
                        ) +

                        ':</strong> ' +

                        escapeHtml(
                            valor
                        ) +

                        '</div>';

                }
            );



            contenido.innerHTML =
                html;

        }



        /*
         * =====================================================
         * ACTIVAR CLICK EN EL MAPA
         * =====================================================
         *
         * IMPORTANTE:
         *
         * No especificamos Z1, Z4 o Z5 acá.
         *
         * Cualquier layer que tenga un campo "text"
         * puede ser utilizado.
         *
         * Por eso esta parte queda ESTANDARIZADA.
         *
         */


        function activarConsultaPlanilla() {


            if (
                typeof map === "undefined" ||
                !map
            ) {


                console.warn(
                    "Mapa todavía no disponible."
                );


                return;

            }



            console.log(
                "Mapa encontrado."
            );


            console.log(
                "Activando consulta de Google Sheets."
            );



            map.on(
                "singleclick",
                function(evt) {


                    let featureEncontrada =
                        null;



                    map.forEachFeatureAtPixel(

                        evt.pixel,

                        function(
                            feature,
                            layer
                        ) {


                            if (!feature) {

                                return;

                            }



                            /*
                             * =================================================
                             * CLAVE PRINCIPAL
                             * =================================================
                             *
                             * SIEMPRE utilizamos "text".
                             */


                            const codigoText =

                                feature.get(
                                    "text"
                                );



                            if (

                                codigoText !==
                                undefined &&

                                codigoText !==
                                null &&

                                String(
                                    codigoText
                                ).trim() !== ""

                            ) {


                                featureEncontrada =
                                    feature;


                                return feature;

                            }


                            return null;

                        },


                        {
                            hitTolerance: 5
                        }

                    );



                    if (
                        !featureEncontrada
                    ) {


                        console.log(

                            "No se encontró un elemento con campo text."

                        );


                        return;

                    }



                    /*
                     * =================================================
                     * OBTENER CÓDIGO
                     * =================================================
                     */


                    const codigo =

                        featureEncontrada.get(
                            "text"
                        );



                    console.log(

                        "Campo text del elemento:",

                        codigo

                    );



                    /*
                     * fid NO SE UTILIZA.
                     *
                     * Solamente lo mostramos en consola
                     * durante las pruebas.
                     */


                    console.log(

                        "Campo fid del elemento (NO UTILIZADO):",

                        featureEncontrada.get(
                            "fid"
                        )

                    );



                    /*
                     * =================================================
                     * BUSCAR EN TODAS LAS PLANILLAS
                     * =================================================
                     */


                    const datos =
                        buscarReja(
                            codigo
                        );



                    mostrarInformacionReja(

                        codigo,

                        datos

                    );



                    /*
                     * =================================================
                     * POSICIONAR POPUP
                     * =================================================
                     */


                    if (
                        typeof popup !==
                        "undefined" &&
                        popup
                    ) {


                        popup.setPosition(
                            evt.coordinate
                        );


                    } else if (

                        typeof overlay !==
                        "undefined" &&
                        overlay

                    ) {


                        overlay.setPosition(
                            evt.coordinate
                        );

                    }

                }
            );



            console.log(

                "Consulta de Google Sheets activada correctamente."

            );

        }



        /*
         * =====================================================
         * INICIAR
         * =====================================================
         */


        cargarTodasLasPlanillas();



        /*
         * Esperar a que QGIS2WEB cree el mapa.
         */


        let intentosMapa = 0;


        const intervaloMapa =

            setInterval(

                function() {


                    intentosMapa++;


                    if (

                        typeof map !==
                        "undefined" &&
                        map

                    ) {


                        clearInterval(
                            intervaloMapa
                        );


                        activarConsultaPlanilla();


                        return;

                    }



                    if (
                        intentosMapa >= 100
                    ) {


                        clearInterval(
                            intervaloMapa
                        );


                        console.error(

                            "No se pudo encontrar el mapa."

                        );

                    }

                },

                100

            );


    

        /* =====================================================
           BUSCADOR POR N° DE REJA
           ===================================================== */

        function buscarFeatureEnMapa(codigo) {
            if (typeof map === "undefined" || !map) return null;

            const buscado = normalizarCodigo(codigo);
            if (!buscado) return null;

            let encontrado = null;

            function revisarCapas(capas) {
                capas.forEach(function(capa) {
                    if (encontrado || !capa) return;

                    if (capa.getLayers && typeof capa.getLayers === "function") {
                        revisarCapas(capa.getLayers().getArray());
                        return;
                    }

                    if (!capa.getSource || !capa.getSource()) return;
                    if (capa.get("esCapaEtiquetas")) return;

                    const source = capa.getSource();
                    if (!source.getFeatures) return;

                    source.getFeatures().some(function(feature) {
                        const texto = normalizarCodigo(feature.get("text"));
                        if (texto === buscado) {
                            encontrado = { feature: feature, layer: capa };
                            return true;
                        }
                        return false;
                    });
                });
            }

            revisarCapas(map.getLayers().getArray());
            return encontrado;
        }

        function abrirRejaEncontrada(codigo, resultadoMapa) {
            const mensaje = document.getElementById("buscador-reja-mensaje");
            if (mensaje) {
                mensaje.style.display = "none";
                mensaje.textContent = "";
            }

            if (!resultadoMapa) {
                if (mensaje) {
                    mensaje.textContent = "No se encontró esa reja en el mapa.";
                    mensaje.style.display = "block";
                }
                return;
            }

            const feature = resultadoMapa.feature;
            const geometria = feature.getGeometry();
            if (!geometria) return;

            let coordenada = null;
            const tipo = geometria.getType();

            if (tipo === "Point") {
                coordenada = geometria.getCoordinates();
            } else if (geometria.getClosestPoint) {
                const centro = geometria.getClosestPoint(geometria.getFirstCoordinate());
                coordenada = centro;
            }

            if (!coordenada) return;

            /* Hacemos visible la capa por si estaba apagada. */
            if (resultadoMapa.layer && resultadoMapa.layer.setVisible) {
                resultadoMapa.layer.setVisible(true);
            }

            map.getView().animate({
                center: coordenada,
                zoom: 19,
                duration: 500
            });

            /* Mostramos exactamente el mismo popup utilizado por el click. */
            const datos = buscarReja(codigo);
            mostrarInformacionReja(codigo, datos);

            if (typeof popup !== "undefined" && popup) {
                popup.setPosition(coordenada);
            } else if (typeof overlay !== "undefined" && overlay) {
                overlay.setPosition(coordenada);
            }
        }

        function ejecutarBusquedaReja() {
            const input = document.getElementById("buscador-reja-input");
            if (!input) return;

            const codigo = input.value.trim();
            if (!codigo) return;

            const resultadoMapa = buscarFeatureEnMapa(codigo);
            abrirRejaEncontrada(codigo, resultadoMapa);
        }

        const botonBusquedaReja = document.getElementById("buscador-reja-boton");
        const inputBusquedaReja = document.getElementById("buscador-reja-input");

        if (botonBusquedaReja) {
            botonBusquedaReja.addEventListener("click", ejecutarBusquedaReja);
        }

        if (inputBusquedaReja) {
            inputBusquedaReja.addEventListener("keydown", function(event) {
                if (event.key === "Enter") ejecutarBusquedaReja();
            });
        }


        /* =====================================================
           ETIQUETAS DE REJAS
           ===================================================== */

        /*
         * QGIS expresa la escala como denominador (por ejemplo 1:1000).
         * En OpenLayers trabajamos con resolution, por eso usamos la
         * conversión equivalente para 96 DPI.
         */
        const RESOLUCION_ETIQUETAS = 0.2646;

        function crearCapaEtiquetasRejas() {
            if (typeof map === "undefined" || !map || etiquetasRejas) return;

            const featuresEtiquetas = [];

            function recorrerCapas(capas) {
                capas.forEach(function(capa) {
                    if (!capa) return;
                    if (capa.get("esCapaEtiquetas")) return;

                    if (capa.getLayers && typeof capa.getLayers === "function") {
                        recorrerCapas(capa.getLayers().getArray());
                        return;
                    }

                    if (!capa.getSource || !capa.getSource()) return;
                    const source = capa.getSource();
                    if (!source.getFeatures) return;

                    source.getFeatures().forEach(function(feature) {
                        const texto = feature.get("text");
                        const geometria = feature.getGeometry();
                        if (texto === undefined || texto === null || String(texto).trim() === "" || !geometria) return;

                        let coordenada = null;
                        if (geometria.getType() === "Point") {
                            coordenada = geometria.getCoordinates();
                        } else if (geometria.getInteriorPoint) {
                            coordenada = geometria.getInteriorPoint().getCoordinates();
                        }
                        if (!coordenada) return;

                        const etiqueta = new ol.Feature({
                            geometry: new ol.geom.Point(coordenada),
                            textoEtiqueta: String(texto),
                            layerOrigen: capa
                        });
                        featuresEtiquetas.push(etiqueta);
                    });
                });
            }

            recorrerCapas(map.getLayers().getArray());

            const sourceEtiquetas = new ol.source.Vector({
                features: featuresEtiquetas
            });

            etiquetasRejas = new ol.layer.Vector({
                source: sourceEtiquetas,
                declutter: true,
                properties: {
                    title: "Etiquetas de rejas",
                    esCapaEtiquetas: true
                },
                style: function(feature, resolution) {
                    if (resolution > RESOLUCION_ETIQUETAS) return null;

                    const origen = feature.get("layerOrigen");
                    if (origen && origen.getVisible && !origen.getVisible()) return null;

                    return new ol.style.Style({
                        text: new ol.style.Text({
                            text: feature.get("textoEtiqueta"),
                            font: "bold 12px Arial",
                            offsetY: -12,
                            padding: [2, 3, 2, 3],
                            fill: new ol.style.Fill({ color: "#222" }),
                            stroke: new ol.style.Stroke({ color: "#fff", width: 3 })
                        })
                    });
                }
            });

            map.addLayer(etiquetasRejas);
        }

        /* Esperamos a que QGIS2Web termine de crear todas las capas. */
        let intentosEtiquetas = 0;
        const intervaloEtiquetas = setInterval(function() {
            intentosEtiquetas++;
            if (typeof map !== "undefined" && map) {
                clearInterval(intervaloEtiquetas);
                crearCapaEtiquetasRejas();
                return;
            }
            if (intentosEtiquetas >= 100) clearInterval(intervaloEtiquetas);
        }, 100);

</script>
