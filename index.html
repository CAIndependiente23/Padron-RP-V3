<!-- ========================================================= -->
<!-- CONSULTA DINÁMICA A GOOGLE SHEETS -->
<!-- ========================================================= -->

<script>

const SHEET_ID = "1DFt05s339jwEDHBIZHh9UB_ULaU7RfQsgaMNnKqZKiM";
const SHEET_GID = "20565275";

const SHEET_URL =
    "https://docs.google.com/spreadsheets/d/" +
    SHEET_ID +
    "/gviz/tq?tqx=out:csv&gid=" +
    SHEET_GID;

let datosPlanilla = [];
let indiceRejas = {};


/* =========================================================
   NORMALIZAR CÓDIGOS
   ========================================================= */

function normalizarCodigo(valor) {

    if (valor === null || valor === undefined) {
        return "";
    }

    return String(valor)
        .normalize("NFKC")
        .replace(/\u00A0/g, " ")
        .replace(/[\u200B-\u200D\uFEFF]/g, "")
        .trim()
        .toUpperCase();
}


/* =========================================================
   ESCAPAR HTML
   ========================================================= */

function escapeHtml(valor) {

    if (valor === null || valor === undefined) {
        return "";
    }

    return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   PARSER CSV
   No depende de PapaParse
   ========================================================= */

function parseCSV(texto) {

    const filas = [];

    let fila = [];
    let campo = "";
    let dentroComillas = false;

    for (let i = 0; i < texto.length; i++) {

        const caracter = texto[i];
        const siguiente = texto[i + 1];

        if (caracter === '"') {

            if (dentroComillas && siguiente === '"') {
                campo += '"';
                i++;
            } else {
                dentroComillas = !dentroComillas;
            }

        } else if (caracter === "," && !dentroComillas) {

            fila.push(campo);
            campo = "";

        } else if (
            (caracter === "\n" || caracter === "\r") &&
            !dentroComillas
        ) {

            if (caracter === "\r" && siguiente === "\n") {
                i++;
            }

            fila.push(campo);
            campo = "";

            if (fila.some(valor => valor.trim() !== "")) {
                filas.push(fila);
            }

            fila = [];

        } else {

            campo += caracter;
        }
    }

    /* Último campo */

    if (campo !== "" || fila.length > 0) {

        fila.push(campo);

        if (fila.some(valor => valor.trim() !== "")) {
            filas.push(fila);
        }
    }

    return filas;
}


/* =========================================================
   CARGAR GOOGLE SHEETS
   ========================================================= */

async function cargarPlanilla() {

    console.log("======================================");
    console.log("Cargando información desde Google Sheets...");
    console.log("URL:", SHEET_URL);

    try {

        const respuesta = await fetch(SHEET_URL);

        if (!respuesta.ok) {
            throw new Error(
                "HTTP " +
                respuesta.status +
                " - " +
                respuesta.statusText
            );
        }

        const csv = await respuesta.text();

        console.log(
            "CSV recibido. Caracteres:",
            csv.length
        );

        const filas = parseCSV(csv);

        console.log(
            "Cantidad de filas detectadas:",
            filas.length
        );

        if (!filas.length) {
            throw new Error("El CSV no contiene filas.");
        }


        /* =====================================================
           BUSCAR AUTOMÁTICAMENTE LA FILA DE ENCABEZADOS
           ===================================================== */

        let filaEncabezados = -1;

        for (let i = 0; i < filas.length; i++) {

            if (!filas[i] || !filas[i].length) {
                continue;
            }

            const primeraCelda =
                normalizarCodigo(filas[i][0]);

            if (
                primeraCelda === "N° REJA" ||
                primeraCelda === "Nº REJA" ||
                primeraCelda === "N°REJA" ||
                primeraCelda === "NºREJA"
            ) {

                filaEncabezados = i;
                break;
            }
        }


        if (filaEncabezados === -1) {

            console.error(
                "No se encontró una fila cuyo primer campo sea N° Reja."
            );

            console.log(
                "Primeras filas recibidas:",
                filas.slice(0, 5)
            );

            throw new Error(
                "No se encontró la fila de encabezados."
            );
        }


        console.log(
            "Fila de encabezados encontrada:",
            filaEncabezados + 1,
            "(fila real de Google Sheets)"
        );


        const encabezados = filas[filaEncabezados];

        console.log(
            "Encabezados detectados:",
            encabezados
        );


        /* =====================================================
           DATOS DESDE LA FILA SIGUIENTE
           ===================================================== */

        datosPlanilla = [];

        for (
            let i = filaEncabezados + 1;
            i < filas.length;
            i++
        ) {

            const fila = filas[i];

            if (!fila || !fila.length) {
                continue;
            }

            const codigo = normalizarCodigo(fila[0]);

            /* Ignorar filas sin código */

            if (!codigo) {
                continue;
            }

            const registro = {};

            /*
             * Guardamos A:W
             */

            for (let j = 0; j < 23; j++) {

                const nombreCampo =
                    encabezados[j] ||
                    "columna_" + (j + 1);

                registro[nombreCampo] =
                    fila[j] !== undefined
                        ? fila[j]
                        : "";
            }

            /*
             * Guardamos también el código de forma
             * independiente para facilitar la búsqueda.
             */

            registro.__codigo = codigo;

            datosPlanilla.push(registro);
        }


        /* =====================================================
           CREAR ÍNDICE
           ===================================================== */

        indiceRejas = {};

        datosPlanilla.forEach(registro => {

            const codigo = registro.__codigo;

            if (codigo) {
                indiceRejas[codigo] = registro;
            }
        });


        console.log(
            "Google Sheets cargado correctamente."
        );

        console.log(
            "Cantidad de registros:",
            datosPlanilla.length
        );

        console.log(
            "Cantidad de códigos indexados:",
            Object.keys(indiceRejas).length
        );


        /* =====================================================
           PRUEBAS
           ===================================================== */

        console.log(
            "Primeros 20 códigos:",
            Object.keys(indiceRejas).slice(0, 20)
        );

        console.log(
            "Prueba 12RP302:",
            indiceRejas[
                normalizarCodigo("12RP302")
            ]
        );

        console.log(
            "Prueba 12RP362:",
            indiceRejas[
                normalizarCodigo("12RP362")
            ]
        );


    } catch (error) {

        console.error(
            "Error cargando Google Sheets:",
            error
        );
    }
}


/* =========================================================
   BUSCAR UNA REJA
   ========================================================= */

function buscarReja(codigo) {

    const codigoNormalizado =
        normalizarCodigo(codigo);

    console.log(
        "Buscando código:",
        codigoNormalizado
    );

    const resultado =
        indiceRejas[codigoNormalizado];

    if (resultado) {

        console.log(
            "REJA ENCONTRADA:",
            resultado
        );

        return resultado;
    }

    console.warn(
        "No se encontró el código:",
        codigoNormalizado
    );

    return null;
}


/* =========================================================
   MOSTRAR INFORMACIÓN
   ========================================================= */

function mostrarInformacionReja(codigo, datos) {

    const contenido =
        document.getElementById("popup-content");

    if (!contenido) {
        return;
    }


    if (!datos) {

        contenido.innerHTML =

            '<div class="popup-title">' +
            '🔲 ' +
            escapeHtml(codigo) +
            '</div>' +

            '<div class="popup-error">' +
            'No se encontró información para esta reja en la planilla.' +
            '</div>' +

            '<div style="margin-top:8px;font-size:12px;color:#777;">' +
            'Búsqueda realizada en columna A.<br>' +
            'Campo utilizado del mapa: <b>text</b>.<br>' +
            'Código buscado: <b>' +
            escapeHtml(codigo) +
            '</b>' +
            '</div>';

        return;
    }


    /*
     * POR AHORA mostramos todos los campos encontrados
     * únicamente para verificar que el enlace funciona.
     *
     * Después elegimos juntos cuáles mostrar.
     */

    let html =

        '<div class="popup-title">' +
        '🔲 ' +
        escapeHtml(codigo) +
        '</div>';


    Object.keys(datos).forEach(campo => {

        if (campo === "__codigo") {
            return;
        }

        const valor = datos[campo];

        if (
            valor === null ||
            valor === undefined ||
            String(valor).trim() === ""
        ) {
            return;
        }

        html +=

            '<div class="popup-data-row">' +
            '<strong>' +
            escapeHtml(campo) +
            ':</strong> ' +
            escapeHtml(valor) +
            '</div>';
    });


    contenido.innerHTML = html;
}


/* =========================================================
   ACTIVAR CONSULTA AL HACER CLICK
   ========================================================= */

function activarConsultaPlanilla() {

    if (
        typeof map === "undefined" ||
        !map
    ) {

        console.warn(
            "Mapa todavía no disponible."
        );

        return;
    }


    console.log(
        "Mapa encontrado. Activando consulta de Google Sheets."
    );


    map.on("singleclick", function(evt) {

        let featureEncontrada = null;


        map.forEachFeatureAtPixel(
            evt.pixel,
            function(feature, layer) {

                if (!feature) {
                    return;
                }

                /*
                 * Tomamos exclusivamente el campo TEXT.
                 */

                const codigoText =
                    feature.get("text");

                if (
                    codigoText !== undefined &&
                    codigoText !== null &&
                    String(codigoText).trim() !== ""
                ) {

                    featureEncontrada = feature;

                    return feature;
                }

                return null;
            },
            {
                hitTolerance: 5
            }
        );


        if (!featureEncontrada) {

            console.log(
                "No se encontró un elemento con campo text."
            );

            return;
        }


        /* =====================================================
           CÓDIGO QGIS
           ===================================================== */

        const codigo =
            featureEncontrada.get("text");


        console.log(
            "Campo text del elemento:",
            codigo
        );


        /*
         * fid solamente se muestra en consola para comprobar
         * que NO estamos utilizándolo.
         */

        console.log(
            "Campo fid del elemento (NO UTILIZADO):",
            featureEncontrada.get("fid")
        );


        console.log(
            "Código QGIS (text):",
            codigo
        );


        /* =====================================================
           BUSCAR EN GOOGLE SHEETS
           ===================================================== */

        const datos =
            buscarReja(codigo);


        mostrarInformacionReja(
            codigo,
            datos
        );


        /* =====================================================
           MOSTRAR POPUP
           ===================================================== */

        const coordenada =
            evt.coordinate;


        if (
            typeof overlay !== "undefined" &&
            overlay
        ) {

            overlay.setPosition(
                coordenada
            );

        } else if (
            typeof popup !== "undefined" &&
            popup
        ) {

            popup.setPosition(
                coordenada
            );
        }

    });


    console.log(
        "Consulta de Google Sheets activada correctamente."
    );
}


/* =========================================================
   INICIALIZACIÓN
   ========================================================= */

cargarPlanilla();


/*
 * Esperamos a que qgis2web termine de crear el mapa.
 */

let intentosMapa = 0;

const intervaloMapa =
    setInterval(function() {

        intentosMapa++;

        if (
            typeof map !== "undefined" &&
            map
        ) {

            clearInterval(
                intervaloMapa
            );

            activarConsultaPlanilla();

            return;
        }


        if (intentosMapa >= 100) {

            clearInterval(
                intervaloMapa
            );

            console.error(
                "No se pudo encontrar el mapa."
            );
        }

    }, 100);

</script>
