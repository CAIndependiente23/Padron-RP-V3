<body>

         ===================================================== -->

             class="ol-popup">

            <a href="#"
               id="popup-closer"
               class="ol-popup-closer">
            </a>

            <div id="popup-content"></div>

        </div>

    </div>



    <!-- =====================================================
         SCRIPTS QGIS2WEB
         ===================================================== -->

    <script src="resources/qgis2web_expressions.js"></script>

    <script src="./resources/functions.js"></script>

    <script src="./resources/ol.js"></script>

    <script src="./resources/ol-layerswitcher.js"></script>

         LAYERS
         ===================================================== -->

    <script src="layers/RPZ5_1.js"></script>

    <script src="layers/RPZ4_2.js"></script>

    <script src="layers/RPZ1_3.js"></script>


    <!-- =====================================================
         ESTILOS DE LOS LAYERS
         ===================================================== -->

    <script src="styles/RPZ5_1_style.js"></script>

    <script src="styles/RPZ4_2_style.js"></script>

    <script src="styles/RPZ1_3_style.js"></script>


    <script src="./layers/layers.js"
            type="text/javascript">

    <script src="./resources/Autolinker.min.js"></script>


    <script src="./resources/qgis2web.js"></script>



    <!-- =====================================================
         GOOGLE SHEETS
         ===================================================== -->

    <script>


        /*
         * =====================================================
         * CONFIGURACIÓN DE PLANILLAS
         * =====================================================
         *
         * Para agregar otra zona en el futuro solamente
         * agregamos otra entrada acá.
         *
         */


        const PLANILLAS = [

            {
                zona: "Z1",

                id: "1DFt05s339jwEDHBIZHh9UB_ULaU7RfQsgaMNnKqZKiM",

                gid: "20565275"
            },


            {
                zona: "Z4",

                id: "1M9GegflJsLEoGBMofbnh4_DiJHtmVKvFpGpc0uswX9k",

                gid: "20565275"
            },


            {
                zona: "Z5",

                id: "1occ_NIMiRZvK9oU398Fbs4INxTNs4vopFmk3G3rm4dk",

                gid: "20565275"
            }

        ];



        /*
         * =====================================================
         * VARIABLES INTERNAS
         * =====================================================
         */

        let datosPlanilla = {};

        let indiceRejas = {};



        /*
         * =====================================================
         * NORMALIZAR CÓDIGOS
         * =====================================================
         */

        function normalizarCodigo(valor) {

            if (
                valor === null ||
                valor === undefined
            ) {

                return "";

            }


            return String(valor)

                .normalize("NFKC")

                .replace(/\u00A0/g, " ")

                .replace(/[\u200B-\u200D\uFEFF]/g, "")

                .trim()

                .toUpperCase();

        }



        /*
         * =====================================================
         * ESCAPAR HTML
         * =====================================================
         */

        function escapeHtml(valor) {

            if (
                valor === null ||
                valor === undefined
            ) {

                return "";

            }


            return String(valor)

                .replace(/&/g, "&amp;")

                .replace(/</g, "&lt;")

                .replace(/>/g, "&gt;")

                .replace(/"/g, "&quot;")

                .replace(/'/g, "&#039;");

        }



        /*
         * =====================================================
         * PARSER CSV
         * =====================================================
         */

        function parseCSV(texto) {

            const filas = [];

            let fila = [];

            let campo = "";

            let dentroComillas = false;


            for (
                let i = 0;
                i < texto.length;
                i++
            ) {

                const caracter = texto[i];

                const siguiente = texto[i + 1];


                if (caracter === '"') {

                    if (
                        dentroComillas &&
                        siguiente === '"'
                    ) {

                        campo += '"';

                        i++;

                    } else {

                        dentroComillas =
                            !dentroComillas;

                    }


                } else if (
                    caracter === "," &&
                    !dentroComillas
                ) {

                    fila.push(campo);

                    campo = "";


                } else if (
                    (
                        caracter === "\n" ||
                        caracter === "\r"
                    ) &&
                    !dentroComillas
                ) {

                    if (
                        caracter === "\r" &&
                        siguiente === "\n"
                    ) {

                        i++;

                    }


                    fila.push(campo);

                    campo = "";


                    if (
                        fila.some(
                            valor =>
                            valor.trim() !== ""
                        )
                    ) {

                        filas.push(fila);

                    }


                    fila = [];


                } else {

                    campo += caracter;

                }

            }


            if (
                campo !== "" ||
                fila.length > 0
            ) {

                fila.push(campo);


                if (
                    fila.some(
                        valor =>
                        valor.trim() !== ""
                    )
                ) {

                    filas.push(fila);

                }

            }


            return filas;

        }



        /*
         * =====================================================
         * CARGAR UNA PLANILLA
         * =====================================================
         */

        async function cargarPlanilla(planilla) {


            console.log(
                "--------------------------------------"
            );


            console.log(
                "Cargando planilla:",
                planilla.zona
            );


            const url =

                "https://docs.google.com/spreadsheets/d/" +

                planilla.id +

                "/gviz/tq?tqx=out:csv&gid=" +

                planilla.gid;


            try {


                const respuesta =
                    await fetch(url);


                if (!respuesta.ok) {

                    throw new Error(

                        "HTTP " +

                        respuesta.status +

                        " - " +

                        respuesta.statusText

                    );

                }


                const csv =
                    await respuesta.text();


                console.log(

                    planilla.zona +

                    " - CSV recibido:",

                    csv.length,

                    "caracteres"

                );


                const filas =
                    parseCSV(csv);


                console.log(

                    planilla.zona +

                    " - filas detectadas:",

                    filas.length

                );


                if (!filas.length) {

                    throw new Error(
                        "El CSV está vacío."
                    );

                }



                /*
                 * =================================================
                 * BUSCAR AUTOMÁTICAMENTE LA FILA DE ENCABEZADOS
                 * =================================================
                 */

                let filaEncabezados = -1;


                for (
                    let i = 0;
                    i < filas.length;
                    i++
                ) {


                    if (
                        !filas[i] ||
                        !filas[i].length
                    ) {

                        continue;

                    }


                    const primeraCelda =

                        normalizarCodigo(
                            filas[i][0]
                        );


                    if (

                        primeraCelda === "N° REJA" ||

                        primeraCelda === "Nº REJA" ||

                        primeraCelda === "N°REJA" ||

                        primeraCelda === "NºREJA"

                    ) {

                        filaEncabezados = i;

                        break;

                    }

                }



                if (
                    filaEncabezados === -1
                ) {

                    console.error(

                        planilla.zona +

                        " - No se encontró N° Reja."

                    );


                    console.log(

                        "Primeras filas:",

                        filas.slice(0, 5)

                    );


                    throw new Error(

                        "No se encontró la fila de encabezados."

                    );

                }



                console.log(

                    planilla.zona +

                    " - encabezados en fila:",

                    filaEncabezados + 1

                );


                const encabezados =
                    filas[filaEncabezados];


                console.log(

                    planilla.zona +

                    " - encabezados:",

                    encabezados

                );



                /*
                 * =================================================
                 * LEER DATOS A:W
                 * =================================================
                 */

                const registros = [];


                for (
                    let i = filaEncabezados + 1;
                    i < filas.length;
                    i++
                ) {


                    const fila = filas[i];


                    if (
                        !fila ||
                        !fila.length
                    ) {

                        continue;

                    }


                    const codigo =
                        normalizarCodigo(
                            fila[0]
                        );


                    if (!codigo) {

                        continue;

                    }


                    const registro = {};


                    /*
                     * Conservamos A:W internamente.
                     */

                    for (
                        let j = 0;
                        j < 23;
                        j++
                    ) {


                        const nombreCampo =

                            encabezados[j] ||

                            "columna_" +
                            (j + 1);


                        registro[nombreCampo] =

                            fila[j] !== undefined

                                ? fila[j]

                                : "";

                    }



                    /*
                     * =================================================
                     * DATOS QUE APARECERÁN EN LA ETIQUETA
                     * =================================================
                     *
                     * A = 0  → N° Reja
                     * C = 2  → Comuna
                     * E = 4  → Altura calle inicio
                     * F = 5  → Altura calle fin
                     * G = 6  → Calle
                     * N = 13 → Longitud
                     */

                    registro.__etiqueta = {

                        nroReja:
                            fila[0] !== undefined
                                ? fila[0]
                                : "",

                        comuna:
                            fila[2] !== undefined
                                ? fila[2]
                                : "",

                        alturaInicio:
                            fila[4] !== undefined
                                ? fila[4]
                                : "",

                        alturaFin:
                            fila[5] !== undefined
                                ? fila[5]
                                : "",

                        calle:
                            fila[6] !== undefined
                                ? fila[6]
                                : "",

                        longitud:
                            fila[13] !== undefined
                                ? fila[13]
                                : ""

                    };


                    registro.__codigo =
                        codigo;


                    registro.__zona =
                        planilla.zona;


                    registros.push(
                        registro
                    );

                }



                /*
                 * Guardar datos de esta zona
                 */

                datosPlanilla[
                    planilla.zona
                ] = registros;



                /*
                 * =================================================
                 * CREAR ÍNDICE GLOBAL
                 * =================================================
                 */

                registros.forEach(
                    registro => {


                        const codigo =
                            registro.__codigo;


                        if (!codigo) {

                            return;

                        }


                        /*
                         * Si existiera el mismo código
                         * en dos planillas, se conserva
                         * el primero.
                         */

                        if (
                            !indiceRejas[codigo]
                        ) {

                            indiceRejas[codigo] =
                                registro;

                        }

                    }
                );



                console.log(

                    planilla.zona +

                    " - registros cargados:",

                    registros.length

                );


                console.log(

                    planilla.zona +

                    " - primer código:",

                    registros.length

                        ? registros[0].__codigo

                        : "NINGUNO"

                );


                return true;


            } catch (error) {


                console.error(

                    "Error cargando " +

                    planilla.zona +

                    ":",

                    error

                );


                return false;

            }

        }



        /*
         * =====================================================
         * CARGAR TODAS LAS PLANILLAS
         * =====================================================
         */

        async function cargarTodasLasPlanillas() {


            console.log(
                "======================================"
            );


            console.log(
                "Cargando información desde Google Sheets..."
            );


            console.log(

                "Planillas configuradas:",

                PLANILLAS.length

            );


            const resultados =
                await Promise.all(

                    PLANILLAS.map(

                        planilla =>
                            cargarPlanilla(
                                planilla
                            )

                    )

                );


            const cantidadCorrectas =
                resultados.filter(
                    resultado => resultado
                ).length;


            console.log(
                "======================================"
            );


            console.log(

                "Planillas cargadas:",

                cantidadCorrectas,

                "/",

                PLANILLAS.length

            );


            console.log(

                "Total de códigos indexados:",

                Object.keys(
                    indiceRejas
                ).length

            );


            console.log(

                "Primeros 20 códigos:",

                Object.keys(
                    indiceRejas
                ).slice(0, 20)

            );


            console.log(

                "Prueba 12RP302:",

                indiceRejas[
                    normalizarCodigo(
                        "12RP302"
                    )
                ]

            );


            console.log(

                "Prueba 12RP362:",

                indiceRejas[
                    normalizarCodigo(
                        "12RP362"
                    )
                ]

            );


            console.log(
                "Google Sheets listo."
            );

        }



        /*
         * =====================================================
         * BUSCAR REJA
         * =====================================================
         */

        function buscarReja(codigo) {


            const codigoNormalizado =

                normalizarCodigo(
                    codigo
                );


            console.log(

                "Buscando código:",

                codigoNormalizado

            );


            const resultado =

                indiceRejas[
                    codigoNormalizado
                ];


            if (resultado) {


                console.log(

                    "REJA ENCONTRADA:",

                    resultado

                );


                return resultado;

            }


            console.warn(

                "No se encontró:",

                codigoNormalizado

            );


            return null;

        }



        /*
         * =====================================================
         * MOSTRAR INFORMACIÓN
         * =====================================================
         *
         * SOLAMENTE se muestran:
         *
         * A → N° Reja
         * C → Comuna
         * E → Altura calle inicio
         * F → Altura calle fin
         * G → Calle
         * N → Longitud
         *
         */

        function mostrarInformacionReja(
            codigo,
            datos
        ) {


            const contenido =

                document.getElementById(
                    "popup-content"
                );


            if (!contenido) {

                return;

            }



            /*
             * =================================================
             * SI NO SE ENCONTRÓ
             * =================================================
             */

            if (!datos) {


                contenido.innerHTML =

                    '<div class="popup-title">' +

                    '🔲 ' +

                    escapeHtml(codigo) +

                    '</div>' +

                    '<div class="popup-error">' +

                    'No se encontró información para esta reja en las planillas.' +

                    '</div>' +

                    '<div style="margin-top:8px;font-size:12px;color:#777;">' +

                    'Búsqueda realizada en columna A.<br>' +

                    'Campo utilizado del mapa: <b>text</b>.<br>' +

                    'Código buscado: <b>' +

                    escapeHtml(codigo) +

                    '</b>' +

                    '</div>';


                return;

            }



            /*
             * =================================================
             * DATOS DE LA ETIQUETA
             * =================================================
             */

            const etiqueta =
                datos.__etiqueta || {};



            /*
             * =================================================
             * TÍTULO
             * =================================================
             */

            let html =

                '<div class="popup-title">' +

                '🔲 ' +

                escapeHtml(

                    etiqueta.nroReja ||

                    codigo

                ) +

                '</div>';



            /*
             * ZONA
             */

            html +=

                '<div class="popup-zone">' +

                escapeHtml(

                    datos.__zona || ""

                ) +

                '</div>';



            /*
             * =================================================
             * COMUNA
             * =================================================
             */

            if (

                etiqueta.comuna !== undefined &&

                String(
                    etiqueta.comuna
                ).trim() !== ""

            ) {


                html +=

                    '<div class="popup-data-row">' +

                    '<strong>Comuna:</strong> ' +

                    escapeHtml(

                        etiqueta.comuna

                    ) +

                    '</div>';

            }



            /*
             * =================================================
             * CALLE
             * =================================================
             */

            if (

                etiqueta.calle !== undefined &&

                String(
                    etiqueta.calle
                ).trim() !== ""

            ) {


                html +=

                    '<div class="popup-data-row">' +

                    '<strong>Calle:</strong> ' +

                    escapeHtml(

                        etiqueta.calle

                    ) +

                    '</div>';

            }



            /*
             * =================================================
             * ALTURA CALLE INICIO
             * =================================================
             */

            if (

                etiqueta.alturaInicio !== undefined &&

                String(
                    etiqueta.alturaInicio
                ).trim() !== ""

            ) {


                html +=

                    '<div class="popup-data-row">' +

                    '<strong>Altura inicio:</strong> ' +

                    escapeHtml(

                        etiqueta.alturaInicio

                    ) +

                    '</div>';

            }



            /*
             * =================================================
             * ALTURA CALLE FIN
             * =================================================
             */

            if (

                etiqueta.alturaFin !== undefined &&

                String(
                    etiqueta.alturaFin
                ).trim() !== ""

            ) {


                html +=

                    '<div class="popup-data-row">' +

                    '<strong>Altura fin:</strong> ' +

                    escapeHtml(

                        etiqueta.alturaFin

                    ) +

                    '</div>';

            }



            /*
             * =================================================
             * LONGITUD
             * =================================================
             */

            if (

                etiqueta.longitud !== undefined &&

                String(
                    etiqueta.longitud
                ).trim() !== ""

            ) {


                html +=

                    '<div class="popup-data-row">' +

                    '<strong>Longitud:</strong> ' +

                    escapeHtml(

                        etiqueta.longitud

                    ) +

                    '</div>';

            }



            contenido.innerHTML =
                html;

        }



        /*
         * =====================================================
         * ACTIVAR CLICK EN EL MAPA
         * =====================================================
         *
         * Cualquier layer que tenga el campo "text"
         * puede utilizar esta misma función.
         *
         */

        function activarConsultaPlanilla() {


            if (
                typeof map === "undefined" ||
                !map
            ) {


                console.warn(
                    "Mapa todavía no disponible."
                );


                return;

            }



            console.log(
                "Mapa encontrado."
            );


            console.log(
                "Activando consulta de Google Sheets."
            );



            map.on(
                "singleclick",
                function(evt) {


                    let featureEncontrada =
                        null;



                    map.forEachFeatureAtPixel(

                        evt.pixel,

                        function(
                            feature,
                            layer
                        ) {


                            if (!feature) {

                                return;

                            }



                            /*
                             * =================================================
                             * UTILIZAMOS ÚNICAMENTE "text"
                             * =================================================
                             */

                            const codigoText =

                                feature.get(
                                    "text"
                                );



                            if (

                                codigoText !==
                                undefined &&

                                codigoText !==
                                null &&

                                String(
                                    codigoText
                                ).trim() !== ""

                            ) {


                                featureEncontrada =
                                    feature;


                                return feature;

                            }


                            return null;

                        },


                        {
                            hitTolerance: 5
                        }

                    );



                    if (
                        !featureEncontrada
                    ) {


                        console.log(

                            "No se encontró un elemento con campo text."

                        );


                        return;

                    }



                    /*
                     * =================================================
                     * OBTENER CÓDIGO DESDE "text"
                     * =================================================
                     */

                    const codigo =

                        featureEncontrada.get(
                            "text"
                        );



                    console.log(

                        "Campo text del elemento:",

                        codigo

                    );



                    /*
                     * fid NO SE UTILIZA
                     */

                    console.log(

                        "Campo fid del elemento (NO UTILIZADO):",

                        featureEncontrada.get(
                            "fid"
                        )

                    );



                    /*
                     * =================================================
                     * BUSCAR EN TODAS LAS PLANILLAS
                     * =================================================
                     */

                    const datos =
                        buscarReja(
                            codigo
                        );



                    mostrarInformacionReja(

                        codigo,

                        datos

                    );



                    /*
                     * =================================================
                     * POSICIONAR POPUP
                     * =================================================
                     */

                    if (
                        typeof popup !==
                        "undefined" &&
                        popup
                    ) {


                        popup.setPosition(
                            evt.coordinate
                        );


                    } else if (

                        typeof overlay !==
                        "undefined" &&
                        overlay

                    ) {


                        overlay.setPosition(
                            evt.coordinate
                        );

                    }

                }
            );



            console.log(

                "Consulta de Google Sheets activada correctamente."

            );

        }



        /*
         * =====================================================
         * INICIAR CARGA DE PLANILLAS
         * =====================================================
         */

        cargarTodasLasPlanillas();



        /*
         * =====================================================
         * ESPERAR A QUE QGIS2WEB CREE EL MAPA
         * =====================================================
         */

        let intentosMapa = 0;


        const intervaloMapa =

            setInterval(

                function() {


                    intentosMapa++;


                    if (

                        typeof map !==
                        "undefined" &&
                        map

                    ) {


                        clearInterval(
                            intervaloMapa
                        );


                        activarConsultaPlanilla();


                        return;

                    }



                    if (
                        intentosMapa >= 100
                    ) {


                        clearInterval(
                            intervaloMapa
                        );


                        console.error(

                            "No se pudo encontrar el mapa."

                        );

                    }

                },

                100

            );


    </script>


</body>
